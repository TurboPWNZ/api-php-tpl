# Production-shape nginx config for api-php-aigen (front-controller PHP app,
# no Apache/.htaccess). Tested locally via docker-compose.nginx.yml — see
# DEPLOY.md for the full deploy guide and the bare-metal (non-Docker)
# equivalent (systemd php8.2-fpm, unix socket instead of php-fpm:9000).
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # Matches php.ini's post_max_size (docker/php-fpm.dockerfile /
    # /etc/php/8.2/fpm/conf.d/*-uploads.ini on bare metal) — nginx's own
    # default (1M) rejects big uploads *before* PHP ever sees them, so
    # bumping php.ini alone is not enough.
    client_max_body_size 30M;

    # ── Block anything that isn't meant to be web-accessible ──────────────
    # The old Apache .htaccess ("existing file/dir → serve it, else →
    # index.php") would happily serve config.php, composer.json, .git/,
    # vendor/ — everything under the project root — since docroot ==
    # project root here (no public/ split). Deny-list it explicitly.
    location ~ \.php$ {
        # Only /index.php may execute; matched by the exact `location =
        # /index.php` below, which takes priority over this regex — so
        # this only ever catches *other* .php requests (vendor/, src/,
        # database/migrations/*.php) and 404s them.
        return 404;
    }

    location ^~ /vendor/  { deny all; return 404; }
    location ^~ /src/     { deny all; return 404; }
    location ^~ /database/{ deny all; return 404; }
    location ^~ /docker/  { deny all; return 404; }
    location ^~ /logs/    { deny all; return 404; }
    location ^~ /.git/    { deny all; return 404; }
    location ^~ /.idea/   { deny all; return 404; }

    location ~* \.(json|md|lock|tpl|dockerfile|ya?ml|log|sql|env)$ {
        deny all;
        return 404;
    }

    # ── Uploaded photos + AI results — served directly, no PHP involved ───
    # index.php's own Access-Control-Allow-Origin header never runs for
    # these (they never reach index.php), so nginx sets it here instead —
    # the frontend fetch()es these cross-origin (e.g. to re-upload a
    # previous result for "Повторить"), which <img src> alone doesn't need
    # but fetch() does enforce CORS for.
    location /storage/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ── Everything else: existing file/dir as-is, otherwise the front
    #    controller ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass php-fpm:9000; # bare metal: unix:/run/php/php8.2-fpm.sock
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Critical, easy to miss: nginx's stock fastcgi_params does NOT
        # forward the Authorization header to PHP by default (unlike
        # Apache+mod_php) — every JWT-protected route would 401 with
        # "Authorization header is missing" without this line.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
}
